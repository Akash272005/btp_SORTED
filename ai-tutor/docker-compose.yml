# ============================================
# bixy_AiTutor Docker Compose Configuration
# ============================================
# This file provides orchestration for bixy_AiTutor services
#
# Usage:
#   Production:  docker compose up -d
#   Development: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   Build only:  docker compose build
#
# Prerequisites:
#   1. Copy .env.example to .env and configure your API keys
#   2. Optionally customize config/main.yaml and config/agents.yaml
# ============================================

version: "3.8"

services:
  # PostgreSQL database used by the AI Tutor LMS.
  db:
    image: postgres:16-alpine
    container_name: cmclearnix-ai-tutor-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-AiTutor}
      POSTGRES_USER: ${POSTGRES_USER:-AiTutor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-this}
    volumes:
      - ai_tutor_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-AiTutor} -d ${POSTGRES_DB:-AiTutor}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - bixy_aitutor-network

  # ============================================
  # All-in-One bixy_AiTutor Service
  # ============================================
  bixy_aitutor:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        # Pass backend port at build time for Next.js static optimization
        - BACKEND_PORT=${BACKEND_PORT:-8001}
    container_name: bixy_aitutor
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8001}:${BACKEND_PORT:-8001}"
      - "127.0.0.1:${FRONTEND_PORT:-3782}:${FRONTEND_PORT:-3782}"

    # Load environment variables from .env file
    env_file:
      - .env

    environment:
      # LLM Configuration (Required)
      - LLM_BINDING=${LLM_BINDING:-openai}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_HOST=${LLM_HOST}
      - DISABLE_SSL_VERIFY=${DISABLE_SSL_VERIFY:-false}
      # Embedding Configuration (Required for Knowledge Base)
      - EMBEDDING_BINDING=${EMBEDDING_BINDING:-openai}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-large}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
      - EMBEDDING_HOST=${EMBEDDING_HOST}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-3072}
      - EMBEDDING_MAX_TOKENS=${EMBEDDING_MAX_TOKENS:-8192}
      # TTS Configuration (Optional)
      - TTS_MODEL=${TTS_MODEL:-}
      - TTS_API_KEY=${TTS_API_KEY:-}
      - TTS_URL=${TTS_URL:-}
      - TTS_VOICE=${TTS_VOICE:-alloy}
      # Web Search Configuration (Optional)
      - SEARCH_PROVIDER=${SEARCH_PROVIDER:-perplexity}
      - SEARCH_API_KEY=${SEARCH_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      # Logging: Configure in config/main.yaml -> logging.level
      # ============================================
      # Service Ports Configuration
      # ============================================
      # Backend API port (default: 8001)
      - BACKEND_PORT=${BACKEND_PORT:-8001}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://AiTutor:local-dev-only-change-this@db:5432/AiTutor}
      # Frontend web port (default: 3782)
      - FRONTEND_PORT=${FRONTEND_PORT:-3782}
      # ============================================
      # API URL Configuration (Important for Cloud Deployment)
      # ============================================
      # For CLOUD/REMOTE deployment: Set this to your server's public URL
      # Example: https://your-server.com:8001 or https://api.yourdomain.com
      # If not set, defaults to http://localhost:${BACKEND_PORT} (only works locally)
      - NEXT_PUBLIC_API_BASE_EXTERNAL=${NEXT_PUBLIC_API_BASE_EXTERNAL:-}
      # Alternative: Direct API base URL (same priority as NEXT_PUBLIC_API_BASE_EXTERNAL)
      - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE:-}

    volumes:
      # Mount local config directory (read-only)
      - ./config:/app/config:ro
      # Mount local data directory for persistence (read-write)
      # This ensures all outputs go to your local ./data directory
      - ./data/user:/app/data/user
      - ./data/knowledge_bases:/app/data/knowledge_bases

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${BACKEND_PORT:-8001}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Resource limits ensure fair multi-student resource sharing (~500 students)
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 2G

    networks:
      - bixy_aitutor-network

  # ============================================
  # Optional: vLLM High-Throughput Inference
  # ============================================
  # Enable with: docker compose --profile vllm up -d
  # Serves 20-30 concurrent students on one GPU (vs 1 with Ollama)
  # Requirements: NVIDIA GPU + nvidia-container-toolkit
  #
  # Setup:
  #   1. Install: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/
  #   2. Add to .env:  LLM_HOST=http://vllm:8000/v1
  #   3. Start:  docker compose --profile vllm up -d
  # ============================================
  vllm:
    image: vllm/vllm-openai:latest
    runtime: nvidia
    profiles: ["vllm"]
    container_name: vllm_server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    command: >
      --model ${VLLM_MODEL:-meta-llama/Llama-3-8B-Instruct}
      --port 8000
      --max-model-len ${VLLM_MAX_LEN:-4096}
      --tensor-parallel-size ${VLLM_TP_SIZE:-1}
      --enforce-eager
    volumes:
      - vllm_cache:/root/.cache/huggingface
    networks:
      - bixy_aitutor-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s

# ============================================
# Networks
# ============================================
networks:
  bixy_aitutor-network:
    driver: bridge

# ============================================
# Volumes
# ============================================
volumes:
  vllm_cache:
    driver: local
  ai_tutor_postgres_data:
    driver: local
